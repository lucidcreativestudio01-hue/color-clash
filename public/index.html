<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Clash</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section id="lobby" class="card"><div class="badge">MULTIPLAYER</div><h1>COLOR CLASH</h1><p>Collect 10 energy orbs before the other players.</p><input id="name" maxlength="16" placeholder="Your nickname"><button id="join">Join Game</button><div class="rules"><b>How to play</b><span>Move with WASD or arrow keys.</span><span>Collect glowing orbs.</span><span>First to 10 points wins.</span></div></section><section id="game" class="hidden"><header><div><div class="badge">LIVE ARENA</div><h1>COLOR CLASH</h1></div><div id="status">Connecting…</div></header><div class="layout"><div class="board-wrap"><canvas id="board" width="1000" height="600"></canvas><div id="winner" class="winner hidden"></div></div><aside class="scoreboard"><h2>Scoreboard</h2><div id="scores"></div></aside></div><p class="hint">WASD / Arrow keys to move • Collect the orb • First to 10 wins</p></section></main><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
